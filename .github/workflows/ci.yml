name: CI

# Only changes to the binaries, the image or the workflow exercised by jobs/default.yml are tested.
# Documentation, other job presets and the HPC scripts do not trigger a run.
# Path filters are not evaluated for tag pushes, so every release tag triggers a run.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &tested-paths
      - "src/**"
      - "lib/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "Sympolis.cwl"
      - "cwl/**"
      - "jobs/default.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths: *tested-paths
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image (edge from main, version and latest from a v* tag)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Must match the dockerPull of the cwl/*.cwl tools, so the CWL run uses the freshly built image.
  IMAGE: ghcr.io/dfg-sos/sympolis
  CWLTOOL_VERSION: 3.1.20260108082145

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      publish: ${{ steps.tags.outputs.publish }}
      release: ${{ steps.tags.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # Release tags v<version> publish <version> and latest and create a release, main publishes edge,
      # other refs publish nothing. Pushes publish, manual runs only if requested.
      - name: Determine what to publish
        id: tags
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          RELEASE=false
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF_NAME#v}"
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $GITHUB_REF_NAME is not of the form v<major>.<minor>.<patch>"; exit 1; }
              TAGS="$IMAGE:$VERSION $IMAGE:latest"
              RELEASE=true ;;
            refs/heads/main) TAGS="$IMAGE:edge" ;;
            *)               TAGS="" ;;
          esac
          PUBLISH=false
          if [ -n "$TAGS" ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$PUBLISH_REQUESTED" = true ]; }; then
            PUBLISH=true
          fi
          [ "$PUBLISH" = true ] || RELEASE=false
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The image is loaded into the local daemon as latest, which the CWL tools reference, so the CWL
      # run below uses it instead of pulling the published image. It is tagged for publishing later on.
      - name: Build binaries and Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test binaries
        run: |
          for bin in SympolisGraphConstruction SympolisGraphComponents SympolisSpatialClustering \
                     SympolisPolygonOutline SympolisEdgeVisualization SympolisMSTVisualization; do
            echo "::group::$bin"
            docker run --rm "$IMAGE:latest" "$bin" --help
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cwltool
        run: pip install "cwltool==$CWLTOOL_VERSION"

      - name: Validate workflow
        run: cwltool --validate Sympolis.cwl

      - name: Run example workflow (jobs/default.yml)
        run: cwltool --outdir ci-output Sympolis.cwl jobs/default.yml

      - name: Check outputs
        run: |
          for f in ci-output/Kahama_Small_Sympolis.gpkg ci-output/Kahama_Small_Sympolis_MultiPolygons.gpkg; do
            test -s "$f" || { echo "::error::Missing or empty output $f"; exit 1; }
          done
          ls -lh ci-output

      - name: Upload workflow outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sympolis-output
          path: ci-output/
          if-no-files-found: ignore

      # The publish job pushes the exact image tested above instead of building it again.
      - name: Save tested image
        if: steps.tags.outputs.publish == 'true'
        run: docker save "$IMAGE:latest" -o "$RUNNER_TEMP/image.tar"

      - name: Upload tested image
        if: steps.tags.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  publish:
    needs: test
    if: needs.test.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        env:
          TAGS: ${{ needs.test.outputs.tags }}
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          for tag in $TAGS; do
            docker tag "$IMAGE:latest" "$tag"
            docker push "$tag"
          done

  # Release tags publish the runner script as GitHub release. The released script installs the
  # workflow of its tag and runs the image of its version.
  release:
    needs: [test, publish]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version of runner script
        run: |
          sed 's/^VERSION="main"$/VERSION="'"$TAG"'"/' prod/hpc/run-sympolis.sh > run-sympolis.sh
          grep -qx "VERSION=\"$TAG\"" run-sympolis.sh || { echo "::error::Could not set VERSION in run-sympolis.sh"; exit 1; }

      - name: Publish release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" run-sympolis.sh --clobber
